<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Focus — a tiny Pomodoro timer</title>
<style>
  :root { --bg:#14161c; --card:#1d2029; --accent:#7dd87d; --break:#7db8d8; --text:#eef1f6; --muted:#8b93a7; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:-apple-system,"Segoe UI",Roboto,sans-serif;
         min-height:100vh; display:flex; align-items:center; justify-content:center; }
  .card { background:var(--card); border-radius:20px; padding:40px 48px; text-align:center;
          box-shadow:0 12px 48px rgba(0,0,0,.45); width:340px; }
  h1 { font-size:15px; letter-spacing:3px; text-transform:uppercase; color:var(--muted); margin-bottom:6px; }
  #mode { font-size:14px; color:var(--muted); margin-bottom:18px; min-height:20px; }
  #ring { width:200px; height:200px; margin:0 auto 18px; position:relative; }
  #ring svg { transform:rotate(-90deg); }
  #time { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
          font-size:44px; font-weight:600; font-variant-numeric:tabular-nums; }
  .btns { display:flex; gap:10px; justify-content:center; margin-bottom:18px; }
  button { border:none; border-radius:10px; padding:10px 20px; font-size:15px; cursor:pointer;
           background:var(--accent); color:#10131a; font-weight:600; }
  button.secondary { background:#2c313e; color:var(--text); }
  button:hover { filter:brightness(1.1); }
  .tabs { display:flex; gap:8px; justify-content:center; margin-bottom:20px; }
  .tabs button { background:#2c313e; color:var(--muted); font-size:13px; padding:8px 14px; }
  .tabs button.active { background:var(--accent); color:#10131a; }
  #count { font-size:13px; color:var(--muted); }
</style>
</head>
<body>
<div class="card">
  <h1>Focus</h1>
  <div id="mode">Pick a mode to begin</div>
  <div id="ring">
    <svg width="200" height="200">
      <circle cx="100" cy="100" r="88" fill="none" stroke="#2c313e" stroke-width="12"/>
      <circle id="prog" cx="100" cy="100" r="88" fill="none" stroke="var(--accent)"
              stroke-width="12" stroke-linecap="round" stroke-dasharray="553" stroke-dashoffset="0"/>
    </svg>
    <div id="time">25:00</div>
  </div>
  <div class="tabs">
    <button data-min="25" class="active">Focus 25</button>
    <button data-min="5">Break 5</button>
    <button data-min="15">Long 15</button>
  </div>
  <div class="btns">
    <button id="toggle">Start</button>
    <button id="reset" class="secondary">Reset</button>
  </div>
  <div id="count">Sessions completed: 0</div>
</div>
<script>
  const CIRC = 553;
  let totalMs = 25 * 60_000;
  let remainingMs = totalMs;
  let timer = null;
  let deadlineMs = null;
  let sessions = 0;
  let isBreak = false;

  const timeEl = document.getElementById('time');
  const modeEl = document.getElementById('mode');
  const progEl = document.getElementById('prog');
  const toggleBtn = document.getElementById('toggle');
  const countEl = document.getElementById('count');

  function fmt(ms) {
    const seconds = Math.ceil(Math.max(0, ms) / 1000);
    return String(Math.floor(seconds / 60)).padStart(2, '0') + ':' +
      String(seconds % 60).padStart(2, '0');
  }

  function render() {
    timeEl.textContent = fmt(remainingMs);
    progEl.style.strokeDashoffset = CIRC * (1 - remainingMs / totalMs);
  }

  function stopClock() {
    if (timer !== null) clearInterval(timer);
    timer = null;
    deadlineMs = null;
  }

  function beep() {
    try {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (!AudioContext) return;
      const ctx = new AudioContext();
      const oscillator = ctx.createOscillator();
      const gain = ctx.createGain();
      oscillator.connect(gain);
      gain.connect(ctx.destination);
      oscillator.frequency.value = 880;
      gain.gain.value = .15;
      oscillator.start();
      oscillator.stop(ctx.currentTime + .4);
      oscillator.onended = () => { void ctx.close(); };
    } catch {
      // Audio is optional; a blocked audio context must not interrupt timing.
    }
  }

  function finish() {
    if (timer === null) return;
    stopClock();
    remainingMs = 0;
    render();
    toggleBtn.textContent = 'Start';
    beep();
    if (!isBreak) {
      sessions += 1;
      countEl.textContent = 'Sessions completed: ' + sessions;
      modeEl.textContent = sessions % 4 === 0
        ? 'Nice streak — take a long break!'
        : 'Focus done! Take a break.';
    } else {
      modeEl.textContent = 'Break over — back to focus!';
    }
  }

  function tick() {
    if (timer === null || deadlineMs === null) return;
    remainingMs = Math.max(0, deadlineMs - Date.now());
    render();
    if (remainingMs === 0) finish();
  }

  toggleBtn.onclick = () => {
    if (timer !== null) {
      tick();
      if (timer !== null) {
        stopClock();
        toggleBtn.textContent = 'Resume';
        modeEl.textContent = isBreak ? 'Break paused' : 'Focus paused';
      }
      return;
    }

    if (remainingMs <= 0) remainingMs = totalMs;
    deadlineMs = Date.now() + remainingMs;
    timer = setInterval(tick, 250);
    toggleBtn.textContent = 'Pause';
    modeEl.textContent = isBreak ? 'On break…' : 'Focusing… stay with it.';
    render();
  };

  document.getElementById('reset').onclick = () => {
    stopClock();
    remainingMs = totalMs;
    toggleBtn.textContent = 'Start';
    modeEl.textContent = isBreak ? 'Break mode' : 'Focus mode';
    render();
  };

  document.querySelectorAll('.tabs button').forEach(button => {
    button.onclick = () => {
      document.querySelectorAll('.tabs button').forEach(tab => tab.classList.remove('active'));
      button.classList.add('active');
      stopClock();
      const minutes = Number(button.dataset.min);
      totalMs = remainingMs = minutes * 60_000;
      isBreak = minutes !== 25;
      progEl.style.stroke = isBreak ? 'var(--break)' : 'var(--accent)';
      toggleBtn.textContent = 'Start';
      modeEl.textContent = isBreak ? 'Break mode' : 'Focus mode';
      render();
    };
  });

  render();
</script>
</body>
</html>
